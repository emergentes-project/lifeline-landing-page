<nav class="navbar" [class.scrolled]="isScrolled" id="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a routerLink="/" class="navbar-logo" (click)="closeMobileMenu()">
        <span class="logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93 0-.62.08-1.22.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </span>
        <span class="logo-text">Lifeline</span>
      </a>

      <div class="navbar-links" [class.active]="isMobileMenuOpen">
        <a routerLink="/" fragment="inicio" (click)="closeMobileMenu()">Inicio</a>
        <a routerLink="/" fragment="como-funciona" (click)="closeMobileMenu()">Cómo funciona</a>
        <a routerLink="/" fragment="ciudadanos" (click)="closeMobileMenu()">Para ciudadanos</a>
        <a routerLink="/" fragment="medicos" (click)="closeMobileMenu()">Para personal médico</a>
        <a routerLink="/descargar" (click)="closeMobileMenu()">Descargar</a>
        <a routerLink="/privacidad" class="mobile-only-link" (click)="closeMobileMenu()">Privacidad</a>

        <div class="mobile-cta">
          <a routerLink="/descargar" class="btn btn-primary" (click)="closeMobileMenu()">
            Descargar app
          </a>
        </div>
      </div>

      <div class="navbar-actions">
        <a routerLink="/descargar" class="btn btn-primary desktop-cta">
          Descargar app
        </a>
        <button
          class="hamburger"
          [class.open]="isMobileMenuOpen"
          (click)="toggleMobileMenu()"
          aria-label="Abrir menú de navegación"
          type="button">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </div>
</nav>
