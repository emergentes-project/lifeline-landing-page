name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build -- --base-href /lifeline-landing-page/

      - name: Support direct links to Angular routes
        run: |
          for route in como-funciona descargar privacidad; do
            mkdir -p "dist/lifeline-landing-page/browser/$route"
            cp dist/lifeline-landing-page/browser/index.html "dist/lifeline-landing-page/browser/$route/index.html"
          done
          cp dist/lifeline-landing-page/browser/index.html dist/lifeline-landing-page/browser/404.html
          touch dist/lifeline-landing-page/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/lifeline-landing-page/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
